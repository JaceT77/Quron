[project]
name = "quron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jace Trent", email = "jacetrent77@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram[i18n]>=3.31.0",
    "httpx2>=2.13.1",
    "ipykernel>=7.4.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.47",
    "structlog>=26.1.0",
]

[project.scripts]
quron = "quron:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
preview = true

[tool.ruff.lint.per-file-ignores]
"src/schemas/**" = ['mixed-case-variable-in-class-scope']
"src/data/__init__.py" = ["non-empty-init-module"]
"src/quron/__init__.py" = ["non-empty-init-module"]

[dependency-groups]
dev = [
    "pandas>=3.0.6",
    "soundfile>=0.14.0",
    "ipython>=9.17.1",
    "pyarrow>=25.0.1",
]
